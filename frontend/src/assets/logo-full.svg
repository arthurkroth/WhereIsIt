<svg width="100%" viewBox="0 0 1100 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>WhereIsIt? logo</title>
  <desc>WhereIsIt? logo: magnifying glass with document and security shield, text in navy and green</desc>
  <defs>
    <clipPath id="lc"><circle cx="155" cy="152" r="91"/></clipPath>
    <linearGradient id="ng" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#174d7c"/>
      <stop offset="100%" stop-color="#07223f"/>
    </linearGradient>
    <linearGradient id="sg" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#45a3d2"/>
      <stop offset="100%" stop-color="#0d5e94"/>
    </linearGradient>
    <radialGradient id="lg" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#e8f4fb"/>
      <stop offset="100%" stop-color="#aacde5"/>
    </radialGradient>
  </defs>

  <!-- top background document -->
  <rect x="216" y="22" width="78" height="114" rx="7" fill="#eef5fd" stroke="#3578c4" stroke-width="2.5"/>
  <rect x="260" y="30" width="14" height="14" rx="3" fill="#3d9e35"/>
  <line x1="226" y1="58" x2="283" y2="58" stroke="#3578c4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="72" x2="283" y2="72" stroke="#3578c4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="86" x2="283" y2="86" stroke="#3578c4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="226" y1="100" x2="270" y2="100" stroke="#3578c4" stroke-width="2" stroke-linecap="round"/>

  <!-- bottom background document with green torn base -->
  <rect x="243" y="150" width="72" height="105" rx="7" fill="#eef5fd" stroke="#3578c4" stroke-width="2.5"/>
  <path d="M243,208 Q249,201 255,208 Q261,201 267,208 Q273,201 279,208 Q285,201 291,207 Q297,202 303,207 L315,208 L315,249 L243,249 Z" fill="#3d9e35"/>
  <line x1="253" y1="165" x2="305" y2="165" stroke="#3578c4" stroke-width="2" stroke-linecap="round"/>
  <line x1="253" y1="178" x2="305" y2="178" stroke="#3578c4" stroke-width="2" stroke-linecap="round"/>
  <line x1="253" y1="191" x2="302" y2="191" stroke="#3578c4" stroke-width="2" stroke-linecap="round"/>

  <!-- handle -->
  <rect x="214" y="230" width="74" height="28" rx="14" fill="url(#ng)" transform="rotate(43,251,244)"/>

  <!-- ring -->
  <circle cx="155" cy="152" r="120" fill="url(#ng)"/>

  <!-- lens -->
  <circle cx="155" cy="152" r="91" fill="url(#lg)"/>
  <circle cx="155" cy="152" r="91" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- lens contents -->
  <g clip-path="url(#lc)">
    <!-- receipt -->
    <g transform="translate(88,96)">
      <path d="M5,0 L21,0 A8,8 0 0,1 37,0 L53,0 Q58,0 58,6 L58,74 Q58,80 52,80 L6,80 Q0,80 0,74 L0,6 Q0,0 5,0 Z" fill="white" stroke="#cddff0" stroke-width="0.8"/>
      <rect x="7" y="8" width="11" height="11" rx="2" fill="#3578c4"/>
      <line x1="7" y1="28" x2="51" y2="28" stroke="#3578c4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="7" y1="39" x2="51" y2="39" stroke="#3578c4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="7" y1="50" x2="44" y2="50" stroke="#3578c4" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="7" y1="61" x2="48" y2="61" stroke="#3578c4" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="12" cy="72" r="6.5" fill="none" stroke="#3578c4" stroke-width="2.2"/>
    </g>
    <!-- shield -->
    <g transform="translate(172,114)">
      <path d="M0,-32 L27,-32 L27,4 Q27,36 0,47 Q-27,36 -27,4 L-27,-32 Z" fill="url(#sg)"/>
      <path d="M0,-26 L21,-26 L21,3 Q21,29 0,38 Q-21,29 -21,3 L-21,-26 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <polyline points="-14,4 -3,16 18,-13" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- logotype text -->
  <text x="316" y="214" font-family="'Nunito','Arial Rounded MT Bold','Trebuchet MS',Verdana,sans-serif" font-weight="900" font-size="158" textLength="758" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#1b4e80">Where</tspan><tspan fill="#3d9e35">IsIt?</tspan>
  </text>
</svg>
